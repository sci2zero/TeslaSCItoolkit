description: >
  "Find radiocarbon dates whose laboratory codes nearly match while age and error match exactly,
  which suggests a mistyped code (AIDA and the Italian records of p3k14c).
  See examples/radiocarbon/README.md to run it on the bundled sample."

join:
  similarity: yes
  similarity_config:
    merge:
      id_columns:
        first: "DateID"
        second: "LabID"
      columns:
        - from_: "LabID"
          into_: "LabID"
          similarity:
            above: 100
            cutoff: 75
            preprocess: yes
          is_reference: yes
        - from_: "Age"
          into_: "CRA"
          similarity:
            scorer: numeric
            within: 0
            at_most: 0
        - from_: "Error"
          into_: "Error"
          similarity:
            scorer: numeric
            within: 0
            at_most: 0
data:
  dest: merged.xlsx
